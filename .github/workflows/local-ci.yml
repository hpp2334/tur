name: Local CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  # 2G thrashed once the deps built at -O1 (`[profile.dev.package."*"]
  # opt-level = 1` — the test-budget fix): every run evicted the entries
  # it was about to need and recompiled the dep tree cold. 10G holds the
  # full dep tree; disk has hundreds of GB.
  SCCACHE_CACHE_SIZE: 10G

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          # The repo mirror lives in the persistent cache volume: the
          # network side is one INCREMENTAL fetch per run (KBs when
          # nothing changed) instead of a cold full clone — the evening
          # SSH crawl to github made that 4-11 minutes for a 10MB pack.
          # HTTPS needs no auth (public repo); the clone itself is local.
          MIRROR=/ci/repo-mirror/tur.git
          mkdir -p /ci/repo-mirror
          if [ ! -d "$MIRROR" ]; then
            git clone --mirror https://github.com/hpp2334/tur.git "$MIRROR"
          fi
          git -C "$MIRROR" fetch origin --prune '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          git clone --branch "$BRANCH_NAME" "$MIRROR" .

      - name: Check merge conflict
        run: |
          git fetch origin main
          BASE=$(git merge-base HEAD origin/main)
          git merge-tree $BASE origin/main HEAD

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build JS
        run: pnpm build

      - name: Install cargo-nextest
        run: |
          command -v cargo-nextest >/dev/null || {
            curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
          }
          cargo nextest --version

      - name: Cargo test
        run: xvfb-run -a cargo nextest run --workspace --locked --profile ci
        timeout-minutes: 5
        env:
          RUST_MIN_STACK: 8388608

      - name: Cargo doc test
        run: cargo test --workspace --doc --locked
        timeout-minutes: 5
        env:
          RUST_MIN_STACK: 8388608

      - name: Cargo clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Check JS
        run: pnpm check

      - name: wasm-pack build
        run: wasm-pack build --target web --no-opt -- --locked
        working-directory: ./demo/website/native

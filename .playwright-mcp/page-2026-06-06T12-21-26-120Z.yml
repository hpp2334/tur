                  - text: Jetpack comprises the
                  - code [ref=e2294]: androidx.*
                  - text: package libraries, unbundled from the platform APIs. This means that it offers backward compatibility and is updated more frequently than the Android platform, making sure you always have access to the latest and greatest versions of the Jetpack components.

[env]
RUST_MIN_STACK = "8388608"

[target.wasm32-unknown-unknown]
# Wasm threading with `wasm_thread` (an `std::thread` drop-in for
# wasm32). Per upstream README
# (https://github.com/chemicstry/wasm_thread), all four pieces are
# required for the wasm memory to be shareable across web workers:
#   1. `+atomics,+bulk-memory,+mutable-globals` target feature
#   2. `--shared-memory` + `--max-memory` + `--import-memory` link args
#   3. `--export=__tls_*` (modern LLVM uses TLS, not `__heap_base`)
#   4. `[unstable] build-std = ["panic_abort", "std"]` (below) — without
#      this, std is compiled without atomics and the resulting TLS
#      layout mismatch traps with "memory access out of bounds".
#
# Unlike wasm-bindgen-rayon, `wasm_thread` requires NO JS-side
# pre-init (no `initThreadPool(n)` call) — workers spawn on demand
# from Rust via `wasm_thread::spawn`. Build with
# `wasm-pack build --target web --profile wasm-dev` to enable.
#
# Status: under this codegen the engine previously trapped with
# "memory access out of bounds" during module evaluation when using
# wasm-bindgen-rayon (observed with the retired JS scripting rail; the
# atomics-enabled LLVM codegen combination was the trigger, not a
# configuration issue — the configuration below matches the upstream
# README exactly). Default
# `wasm-pack build --target web --no-opt` produces a working
# single-threaded wasm; threaded mode is opt-in via `--profile wasm-dev`.
rustflags = [
    "-C",
    "target-feature=+atomics,+bulk-memory,+mutable-globals",
    "-C",
    "link-arg=--shared-memory",
    "-C",
    "link-arg=--max-memory=1073741824",
    # Wasm worker stacks are browser-controlled (V8 default ≈ 1 MB) and
    # ignore `RUST_MIN_STACK`; deep recursion during playground module
    # evaluation (text shaping / reactive graph) overflows it and traps as an
    # opaque `unreachable` (the panic hook itself cannot run — no stack left).
    # Declare an 8 MB wasm stack, matching the native lanes.
    "-C",
    "link-arg=-zstack-size=8388608",
    "-C",
    "link-arg=--import-memory",
    "-C",
    "link-arg=--export=__wasm_init_tls",
    "-C",
    "link-arg=--export=__tls_size",
    "-C",
    "link-arg=--export=__tls_align",
    "-C",
    "link-arg=--export=__tls_base",
    "-C",
    "link-arg=--export=__heap_base",
]

[target.x86_64-apple-darwin]
# Ad-hoc sign every binary linked for Intel macOS. Unsigned Mach-O execs
# consult taskgated, which can wedge under concurrent unsigned exec load
# (parallel builds), stalling every subsequent exec by ~26-35s each.
# Apple Silicon links already ad-hoc-sign by default; Intel does not.
#
# The new Apple linker (1221.4+) dropped `-Wl,-adhoc_sign`, so signing
# rides the `codesign-cc.sh` wrapper: link exactly as rustc asked, then
# `codesign -f -s -` the `-o` output. Scoped to this target only —
# other targets are unaffected. (Same mechanism as the rut repo.)
linker = "scripts/codesign-cc.sh"

[unstable]
build-std = ["panic_abort", "std"]

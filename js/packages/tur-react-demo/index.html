<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tur playground</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    </style>
    <script type="module">
        import init, { TurWasmApp } from "./tur_wasm.js";

        globalThis.initTurWasm = async (containerId) => {
            await init();
            return TurWasmApp.create_in(containerId);
        };
    </script>
</head>
<body>
    <div id="root"></div>
</body>
</html>

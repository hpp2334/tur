[package]
name = "tur-integration-tests"
description = "Integration tests for tur element tree via JS bundles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tur-engine = { workspace = true, features = ["trace"] }
tur-shared = { workspace = true }
boa_engine = { workspace = true }

[dev-dependencies]
minifb = "0.28"
pollster = "0.4"
raw-window-handle = "0.6"
thiserror = { workspace = true }
vello = { workspace = true, features = ["wgpu"] }

[[test]]
name = "vello"
path = "tests/vello/main.rs"
harness = false

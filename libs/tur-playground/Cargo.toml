[package]
name = "tur-playground"
description = "The playground's rut compile service — the `pg_*` host-pkg rows (compile a rut module in-realm, register it as a virtual-app source, answer the source id)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tur-engine = { workspace = true }
rut-vm = { workspace = true }
rut-driver = { workspace = true }
rut-core = { workspace = true }
rut-lexer = { workspace = true }
rut-lsp = { workspace = true }
# The highlight drives the Lsp actor inline: the loop future rides a
# futures LocalPool (wasm-safe — `spawn_native` is native-gated upstream,
# `boot(spawn)` is the open seam), and the JSON envelopes decode via
# serde_json.
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
serde_json = "1"

[package]
name = "tur-wasm"
description = "WebAssembly binary for tur rendering engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tur-engine = { workspace = true }
tur-shared = { workspace = true }
vello = { workspace = true, features = ["wgpu"] }
boa_engine = { workspace = true, features = ["js"] }
tracing = { workspace = true }
tracing-wasm = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlTextAreaElement",
    "Node",
    "EventTarget",
    "Event",
    "MouseEvent",
    "KeyboardEvent",
    "CompositionEvent",
    "FocusEvent",
    "CssStyleDeclaration",
    "DomRect",
    "DomRectReadOnly",
] }
js-sys = "0.3"
console_error_panic_hook = { workspace = true }
getrandom = { workspace = true, features = ["wasm_js"] }
wasm-bindgen-futures = { workspace = true }
wgpu = { version = "29.0.3" }

[package]
name = "tur-wasm"
description = "WebAssembly binary for tur rendering engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tur = { workspace = true }
tur-shared = { workspace = true }
tur-widget = { workspace = true }
tur-layout = { workspace = true }
tur-render-tree = { workspace = true }
tur-vello-renderer = { workspace = true }
tur-boajs = { workspace = true }
winit = { workspace = true }
vello = { workspace = true }
boa_engine = { workspace = true }
tracing = { workspace = true }
tracing-wasm = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }
console_error_panic_hook = { workspace = true }
getrandom = { workspace = true, features = ["wasm_js"] }

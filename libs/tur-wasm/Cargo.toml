[package]
name = "tur-wasm"
description = "WebAssembly binary for tur rendering engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
tur-engine = { workspace = true, features = ["webgl"] }
tur-animation = { workspace = true }
tur-clipboard-wasm = { workspace = true }
tur-net-wasm = { workspace = true }
tur-filepicker-wasm = { workspace = true }
boa_engine = { workspace = true, features = ["js"] }
parley = { workspace = true }
tracing = { workspace = true }
tracing-wasm = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlTextAreaElement",
    "Node",
    "EventTarget",
    "Event",
    "MouseEvent",
    "KeyboardEvent",
    "CompositionEvent",
    "FocusEvent",
    "CssStyleDeclaration",
    "DomRect",
    "DomRectReadOnly",
    "WheelEvent",
    "TouchEvent",
    "Touch",
    "TouchList",
    "Navigator",
    "Clipboard",
    "ClipboardEvent",
    "DataTransfer",
    "ResizeObserver",
] }
js-sys = "0.3"
console_error_panic_hook = { workspace = true }
getrandom = { workspace = true, features = ["wasm_js"] }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-rayon = "1.2"

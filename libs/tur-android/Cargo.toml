[package]
name = "tur-android"
description = "Embedder glue for running the tur engine on Android (wgpu/Vulkan over a Surface, JNI event/loop bridge). Link this as an rlib from your own cdylib to inject custom plugins."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# rlib only: every app builds its own cdylib (so it can inject plugins). This
# crate provides the engine-build helper, the standard-op implementations, and
# the `standard_jni_exports!()` macro that generates the `Java_org_tur_TurNative_*`
# forwarders inside the app's crate.
crate-type = ["rlib"]

[dependencies]
tur-engine = { workspace = true, features = ["wgpu-backend"], default-features = false }
tur-animation = { workspace = true }
tur-clipboard-android = { path = "../tur-clipboard-android" }
boa_engine = { workspace = true }
parley = { workspace = true }
tur-native = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
jni = "0.21"
pollster = "0.4"
wgpu = { workspace = true }
raw-window-handle = "0.6"
thiserror = { workspace = true }
# Drives the async pump/wake on the JNI thread — `TurApp::pump` /
# `TurApp::wake` are `async fn`, the engine exposes no sync wrapper, so the
# embedder supplies the runtime. The JNI render-tick blocks on each frame's
# future via `futures::executor::block_on`.
futures = { workspace = true }
# Tokio runtime — used by `AndroidSchedulerDriver` for **timers only**
# (`tokio::time::sleep`). Shared with `HttpBackend` for reqwest calls.
tokio = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"
# boa_engine's default NaN-boxed `JsValueInner` assumes pointer layouts that
# don't hold on aarch64 Android (the allocator hands back addresses whose low
# bits/length violate the 51-bit/4-bit-alignment tag invariant, so
# `tag_pointer` panics at boot). boa's `jsvalue-enum` feature swaps in an
# enum-backed `JsValueInner` that has no pointer-tagging assumptions — slower
# but compatible (see boa-dev/boa#4275). Scoped to Android only: feature
# unification pulls this into every `boa_engine` user *in this build* (i.e.
# tur-engine, tur-animation, …), but only when `tur-android` is in the dep
# graph, so desktop/wasm builds keep the fast NaN-boxed path.
boa_engine = { workspace = true, features = ["jsvalue-enum"] }

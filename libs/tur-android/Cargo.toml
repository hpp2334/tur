[package]
name = "tur-android"
description = "Embedder glue for running the tur engine on Android (wgpu/Vulkan over a Surface, JNI event/loop bridge). Link this as an rlib from your own cdylib to inject custom plugins."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# rlib only: every app builds its own cdylib (so it can inject plugins). This
# crate provides the engine-build helper, the standard-op implementations, and
# the `standard_jni_exports!()` macro that generates the `Java_org_tur_TurNative_*`
# forwarders inside the app's crate.
crate-type = ["rlib"]

[dependencies]
tur-engine = { workspace = true, features = ["wgpu-backend"], default-features = false }
tur-animation = { workspace = true }
tur-clipboard-android = { path = "../tur-clipboard-android" }
tur-net-native = { workspace = true }
parley = { workspace = true }
tur-native = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
jni = "0.21"
pollster = "0.4"
wgpu = { workspace = true }
raw-window-handle = "0.6"
thiserror = { workspace = true }
# Drives the async loop/wake on the JNI thread — `TurAppLooper::run` /
# `TurApp::wake` are `async fn`, the engine exposes no sync wrapper, so the
# embedder supplies the runtime. The JNI render-tick blocks on each frame's
# future via `futures::executor::block_on`.
futures = { workspace = true }
# Tokio runtime — used by `AndroidSchedulerDriver` for **timers only**
# (`tokio::time::sleep`). Shared with `HttpBackend` for reqwest calls.
tokio = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"

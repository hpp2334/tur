[package]
name = "tur-native"
description = "Native platform integrations for tur (system font loader, worker pool executor)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tur-engine = { workspace = true }
tracing = { workspace = true }
# oneshot channel for `spawn_blocking` completion wakes
futures = { workspace = true }

# parley's `system` feature pulls in the platform font backends
# (CoreText on macOS, DirectWrite on Windows, fontconfig on Linux), which
# auto-discover installed fonts AND populate the generic family map
# (SansSerif/Serif/Monospace) from the OS.
parley = { workspace = true, features = ["system"] }

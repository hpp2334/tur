[workspace]
resolver = "3"
members = [
    "libs/tur-shared",
    "libs/tur-async",
    "libs/tur-engine",
    "libs/tur-std",
    "libs/tur-clipboard",
    "libs/tur-net",
    "libs/tur-wasm",
    "libs/tur-integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hpp2334/tur"

[workspace.dependencies]
tur-shared = { path = "libs/tur-shared" }
tur-async = { path = "libs/tur-async" }
tur-engine = { path = "libs/tur-engine", default-features = false }
tur-std = { path = "libs/tur-std" }
tur-clipboard = { path = "libs/tur-clipboard" }
tur-net = { path = "libs/tur-net" }
tur-integration-tests = { path = "libs/tur-integration-tests" }

num-derive = "0.4"
num-traits = "0.2"

parley = { version = "0.9", default-features = false, features = ["std"] }
wgpu = "29"
boa_engine = { git = "https://github.com/hpp2334/boa.git", rev = "7addeb39597f60156cd355022196772d32e60a9d" }
boa_gc = { git = "https://github.com/hpp2334/boa.git", rev = "7addeb39597f60156cd355022196772d32e60a9d" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.47"
usvg = "0.47"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-wasm = "0.2"
thiserror = "2"
unicode-segmentation = "1"
wasm-bindgen = "0.2.100"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = "0.4"
wasm-bindgen-futures = "0.4"
winit = "0.30"

[workspace]
resolver = "3"
members = [
    "libs/tur-engine",
    "libs/tur-animation",
    "libs/tur-clipboard-wasm",
    "libs/tur-clipboard-native",
    "libs/tur-clipboard-android",
    "libs/tur-net-capability",
    "libs/tur-net-wasm",
    "libs/tur-net-native",
    "libs/tur-filepicker-capability",
    "libs/tur-filepicker-wasm",
    "libs/tur-filepicker-native",
    "libs/tur-wasm",
    "libs/tur-native",
    "libs/tur-android",
    "libs/tur-playground",
    "libs/tur-integration-tests",
    "demo/compose/native",
    "demo/website/native",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hpp2334/tur"

[workspace.dependencies]
tur-engine = { path = "libs/tur-engine", default-features = false }
tur-animation = { path = "libs/tur-animation" }
tur-clipboard-wasm = { path = "libs/tur-clipboard-wasm" }
tur-clipboard-native = { path = "libs/tur-clipboard-native" }
tur-clipboard-android = { path = "libs/tur-clipboard-android" }
tur-net-capability = { path = "libs/tur-net-capability" }
tur-net-wasm = { path = "libs/tur-net-wasm" }
tur-net-native = { path = "libs/tur-net-native" }
tur-filepicker-capability = { path = "libs/tur-filepicker-capability" }
tur-filepicker-wasm = { path = "libs/tur-filepicker-wasm" }
tur-filepicker-native = { path = "libs/tur-filepicker-native" }
tur-native = { path = "libs/tur-native" }
tur-android = { path = "libs/tur-android" }
tur-playground = { path = "libs/tur-playground" }
tur-integration-tests = { path = "libs/tur-integration-tests" }
tur-wasm = { path = "libs/tur-wasm" }

# rut scripting language (github.com/hpp2334/rut) — tracked pin, bumped to
# master (442a979) on 2026-10-06. Same nightly pin as this workspace
# (nightly-2026-07-15).
rut-core = { git = "https://github.com/hpp2334/rut", rev = "442a97979b2aa4b0935a3416bb69db87b8272092" }
rut-parser = { git = "https://github.com/hpp2334/rut", rev = "442a97979b2aa4b0935a3416bb69db87b8272092" }
rut-driver = { git = "https://github.com/hpp2334/rut", rev = "442a97979b2aa4b0935a3416bb69db87b8272092", default-features = false }
# rut-driver's default-on `http` feature pulls reqwest + tokio — tokio does
# not compile on wasm32. tur mounts only local dirs (mount_std_* / mount_dir
# from a local path) and never uses the url-dep lane, so it stays off for
# every target.
rut-vm = { git = "https://github.com/hpp2334/rut", rev = "442a97979b2aa4b0935a3416bb69db87b8272092" }
rut-std = { git = "https://github.com/hpp2334/rut", rev = "442a97979b2aa4b0935a3416bb69db87b8272092" }
# The playground's syntax highlighting classifies rut source through the
# upstream semantic classifier (`pg_highlight`); `normalize` still slices
# the source tur-side — the same lexer rev the parser rides.
rut-lexer = { git = "https://github.com/hpp2334/rut", rev = "442a97979b2aa4b0935a3416bb69db87b8272092" }
# The AST-semantic classifier behind `pg_highlight` — token + name classes
# over spans. Pure frontend (rut-lexer / rut-ast / rut-parser only — no LSP
# types, no serde), pinned to the same rev as the engine crates.
rut-semantic = { git = "https://github.com/hpp2334/rut", rev = "442a97979b2aa4b0935a3416bb69db87b8272092" }


num-derive = "0.4"
num-traits = "0.2"
futures = "0.3"
# Native async runtime — used by `AndroidSchedulerDriver` for `sleep`
# (via `tokio::time::sleep`) + shared with `NativeHttp` for reqwest.
# The engine itself is tokio-free; only native embedders depend on this.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync"] }
# `mpsc` replacement used throughout the engine — main↔worker, RPC replies.
# Pure Rust, no platform deps; works on native (via std::thread::park) and
# wasm (via Atomics.wait on workers, wasm_bindgen_futures on main).
async-channel = "2"

parley = { version = "0.9", default-features = false, features = ["std"] }
wgpu = "29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.47"
usvg = "0.47"
vello_hybrid = { git = "https://github.com/linebender/vello.git", rev = "cd852dc06bc0f9011385fc63a4852b0fc853f4b1", default-features = false, features = ["text"] }
vello_common = { git = "https://github.com/linebender/vello.git", rev = "cd852dc06bc0f9011385fc63a4852b0fc853f4b1", default-features = false, features = ["std"] }
glifo = { git = "https://github.com/linebender/vello.git", rev = "cd852dc06bc0f9011385fc63a4852b0fc853f4b1", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-wasm = "0.2"
thiserror = "2"
unicode-segmentation = "1"
wasm-bindgen = "0.2.126"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = "0.4"
wasm-bindgen-futures = "0.4"
winit = "0.30"

# Wasm thread builds (shared-memory Web Workers for the engine's worker
# thread) require `panic = "abort"` so the resulting wasm can be loaded
# into web workers via shared memory. Native builds keep `panic = "unwind"`
# (tur-android JNI trampoline and vello integration tests rely on
# `catch_unwind`). The dedicated profile is selected via
# `wasm-pack build --profile wasm-dev`.
# Deps almost never need variable-level debuginfo in dev builds; keep only
# line tables (backtraces stay useful) to cut target/ size roughly in half.
# Workspace crates keep full debuginfo from the default dev profile.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.wasm-dev]
inherits = "dev"
panic = "abort"

[profile.wasm-release]
inherits = "release"
panic = "abort"

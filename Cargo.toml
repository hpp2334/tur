[workspace]
resolver = "3"
members = [
    "libs/tur-engine",
    "libs/tur-animation",
    "libs/tur-clipboard-wasm",
    "libs/tur-clipboard-native",
    "libs/tur-clipboard-android",
    "libs/tur-net-capability",
    "libs/tur-net-wasm",
    "libs/tur-net-native",
    "libs/tur-filepicker-capability",
    "libs/tur-filepicker-wasm",
    "libs/tur-filepicker-native",
    "libs/tur-wasm",
    "libs/tur-native",
    "libs/tur-android",
    "libs/tur-playground",
    "libs/tur-integration-tests",
    "demo/compose/native",
    "demo/website/native",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hpp2334/tur"

[workspace.dependencies]
tur-engine = { path = "libs/tur-engine", default-features = false }
tur-animation = { path = "libs/tur-animation" }
tur-clipboard-wasm = { path = "libs/tur-clipboard-wasm" }
tur-clipboard-native = { path = "libs/tur-clipboard-native" }
tur-clipboard-android = { path = "libs/tur-clipboard-android" }
tur-net-capability = { path = "libs/tur-net-capability" }
tur-net-wasm = { path = "libs/tur-net-wasm" }
tur-net-native = { path = "libs/tur-net-native" }
tur-filepicker-capability = { path = "libs/tur-filepicker-capability" }
tur-filepicker-wasm = { path = "libs/tur-filepicker-wasm" }
tur-filepicker-native = { path = "libs/tur-filepicker-native" }
tur-native = { path = "libs/tur-native" }
tur-android = { path = "libs/tur-android" }
tur-playground = { path = "libs/tur-playground" }
tur-integration-tests = { path = "libs/tur-integration-tests" }
tur-wasm = { path = "libs/tur-wasm" }

# rut scripting language (github.com/hpp2334/rut) — tracked pin, bumped to
# latest main (460e8887, 2026-11-22) — 25 commits past the previous pin
# (0ca49f6d, 2026-11-21): the GLOB LEAF lands (use pkg::* + the brace
# star — a grammar feature; the driver's glob expansion binds the pub
# surface), the Name vocabulary (every AST name carries its span),
# NodeKindId becomes the closed enum AnyHandle::kind carries, the
# rut-ast Doc pipeline + edit door, rut-lsp's mounted-world layer split
# (its own shell + MountedFile migration; the Lsp/Io ABI held — tur's
# actor-driven highlighter rode through untouched), and vscode bumps.
# No rut/* std source moved (no re-vendor, no new std tag). At
# 0ca49f6d, the big consolidation: rut-semantic DIES (absorbed into
# rut-lsp behind the privacy wall — Lsp/Io its only public doors;
# tur's highlighter rides the rut-lsp ACTOR — the loop on a tur-owned
# LocalPool via boot's spawn seam, analyze() driven synchronously
# through run_until); the drop-mut law (mut fully removed — mutable by
# default, `const` the shallow opt-out; every tur .rut source swept);
# grammar deletions (inline mod form, x?, ~x, ctor patterns,
# const-generic args; `host`/`when` reserved); wire 23 / bundle
# 12-only (Manifest.legacy_entry gone); the run-chain reshape
# (RutRun::pkg takes Offer, source Mounted rides RutRun::mount,
# Ret::into_slot marshaling); std-v18 (nmapset host-side values —
# vendored closure re-vendored).
# Same nightly pin as this workspace (nightly-2026-07-15).
rut-core = { git = "https://github.com/hpp2334/rut", rev = "460e8887ab6193dccc985aa253657a9681677e88" }
rut-driver = { git = "https://github.com/hpp2334/rut", rev = "460e8887ab6193dccc985aa253657a9681677e88", default-features = false }
# rut-driver's default-on `http` feature pulls reqwest + tokio — tokio does
# not compile on wasm32. tur mounts only local dirs (mount_std_* / mount_dir
# from a local path) and never uses the url-dep lane, so it stays off for
# every target.
rut-vm = { git = "https://github.com/hpp2334/rut", rev = "460e8887ab6193dccc985aa253657a9681677e88" }
rut-std = { git = "https://github.com/hpp2334/rut", rev = "460e8887ab6193dccc985aa253657a9681677e88" }
# The playground's syntax highlighting classifies rut source through the
# rut-lsp actor (`pg_highlight` — the Lsp handle driven inline over a
# LocalPool: `analyze`'s semantic-token stream + `legend`), replacing
# the rut-semantic classifier the privacy wall sealed away. rut-lexer
# stays a direct dep for the canonical text + the comment side table.
rut-lexer = { git = "https://github.com/hpp2334/rut", rev = "460e8887ab6193dccc985aa253657a9681677e88" }
rut-lsp = { git = "https://github.com/hpp2334/rut", rev = "460e8887ab6193dccc985aa253657a9681677e88" }
# The AST + grammar half (the parser lives inside rut-ast since the
# merge) — the kit embeds + decl tree ride it. Pinned to the same rev
# as the engine crates.
rut-ast = { git = "https://github.com/hpp2334/rut", rev = "460e8887ab6193dccc985aa253657a9681677e88" }
# The native pkg-dir walker/loader (`load_path_session` — the REAL
# discovery lane the tur_host decl-tree pin test loads the committed
# tree through). Pinned to the same rev as the engine crates.
rut-native = { git = "https://github.com/hpp2334/rut", rev = "460e8887ab6193dccc985aa253657a9681677e88", default-features = false }


num-derive = "0.4"

num-traits = "0.2"
futures = "0.3"
# Native async runtime — used by `AndroidSchedulerDriver` for `sleep`
# (via `tokio::time::sleep`) + shared with `NativeHttp` for reqwest.
# The engine itself is tokio-free; only native embedders depend on this.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync"] }
# `mpsc` replacement used throughout the engine — main↔worker, RPC replies.
# Pure Rust, no platform deps; works on native (via std::thread::park) and
# wasm (via Atomics.wait on workers, wasm_bindgen_futures on main).
async-channel = "2"

parley = { version = "0.9", default-features = false, features = ["std"] }
wgpu = "29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.47"
usvg = "0.47"
vello_hybrid = { git = "https://github.com/linebender/vello.git", rev = "cd852dc06bc0f9011385fc63a4852b0fc853f4b1", default-features = false, features = ["text"] }
vello_common = { git = "https://github.com/linebender/vello.git", rev = "cd852dc06bc0f9011385fc63a4852b0fc853f4b1", default-features = false, features = ["std"] }
glifo = { git = "https://github.com/linebender/vello.git", rev = "cd852dc06bc0f9011385fc63a4852b0fc853f4b1", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-wasm = "0.2"
thiserror = "2"
unicode-segmentation = "1"
wasm-bindgen = "0.2.126"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = "0.4"
wasm-bindgen-futures = "0.4"
winit = "0.30"

# Wasm thread builds (shared-memory Web Workers for the engine's worker
# thread) require `panic = "abort"` so the resulting wasm can be loaded
# into web workers via shared memory. Native builds keep `panic = "unwind"`
# (tur-android JNI trampoline and vello integration tests rely on
# `catch_unwind`). The dedicated profile is selected via
# `wasm-pack build --profile wasm-dev`.
# Deps almost never need variable-level debuginfo in dev builds; keep only
# line tables (backtraces stay useful) to cut target/ size roughly in half.
# Workspace crates keep full debuginfo from the default dev profile.
# Deps also build at -O1: the test suite is dominated by the rut VM
# (a tree-walking interpreter — every case/kit compile in every fixture
# rides it) and parley's text shaping, both DEPENDENCIES. Debug-speed
# interpretation made the CI Cargo-test budget the binding constraint;
# -O1 on deps runs the suite ~2x faster while tur-* crates (the code
# being iterated on) stay fast to build with full debuginfo. The test
# profile inherits this override (`cargo nextest run` = test profile).
[profile.dev.package."*"]
debug = "line-tables-only"
opt-level = 1

[profile.wasm-dev]
inherits = "dev"
panic = "abort"

[profile.wasm-release]
inherits = "release"
panic = "abort"


[workspace]
resolver = "3"
members = [
    "libs/tur-shared",
    "libs/tur-widget",
    "libs/tur-layout",
    "libs/tur-render-tree",
    "libs/tur-vello-renderer",
    "libs/tur-noop-renderer",
    "libs/tur-boajs",
    "libs/tur",
    "libs/tur-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hpp2334/tur"

[workspace.dependencies]
tur-shared = { path = "libs/tur-shared" }
tur-widget = { path = "libs/tur-widget" }
tur-layout = { path = "libs/tur-layout" }
tur-render-tree = { path = "libs/tur-render-tree" }
tur-vello-renderer = { path = "libs/tur-vello-renderer" }
tur-noop-renderer = { path = "libs/tur-noop-renderer" }
tur-boajs = { path = "libs/tur-boajs" }
tur = { path = "libs/tur" }

winit = "0.30"
vello = "0.4"
boa_engine = { git = "https://github.com/boa-dev/boa", rev = "3cec5e6bc4454077cb8d65b537d368d633137e0e" }
boa_gc = { git = "https://github.com/boa-dev/boa", rev = "3cec5e6bc4454077cb8d65b537d368d633137e0e" }
raw-window-handle = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-wasm = "0.2"
thiserror = "2"
wasm-bindgen = "0.2.100"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = "0.3"
